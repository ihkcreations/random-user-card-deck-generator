<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>random user card deck generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>user deck</h1>
    <div class="controls">
      <button id="btn-generate" type="button">generate</button>
      <button id="btn-export" type="button" disabled>export json</button>
    </div>
  </header>
  <main class="app-main">
    <section class="filter-bar">
      <label for="search-input">filter</label>
      <input id="search-input" type="text" placeholder="search name or role">
      <div class="stat-box">
        <span>count: </span>
        <span id="card-count">0</span>
      </div>
    </section>
    <section id="card-container" class="card-grid"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
